<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Inscription</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="auth-layout">
  <nav class="auth-nav">
    <a href="index.html">Accueil</a>
    <a href="inscription.html" class="active">Inscription</a>
    <a href="connexion.html">Connexion</a>
  </nav>

  <div class="premium-card">
    <h2>Créer un compte <span>💜</span></h2>
    
    <form id="form_register" class="premium-form">
      <input type="email" id="email" class="premium-input" placeholder="Email" required>
      <input type="text" id="username" class="premium-input" placeholder="Nom d'utilisateur" required>
      <input type="password" id="password" class="premium-input" placeholder="Mot de passe" required>
      <input type="password" id="confirm_password" class="premium-input" placeholder="Confirmer mot de passe" required>
      <button type="submit" class="premium-btn">S'inscrire</button>
    </form>
    
    <div class="auth-links">
      <a href="connexion.html" class="auth-link">Déjà un compte ? Se connecter</a>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
